<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1791" viewBox="0 0 390 1791"><rect width="100%" height="100%" fill="#f7f7fa"/><rect x="0" y="0" width="390" height="106" rx="0" fill="#65558f" stroke="none"/><text x="20" y="44.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">MediMate</text><text x="20" y="75.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="white">Synthetic patient 01  /  B2</text><text x="20" y="156.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#202124">Medicine information</text><text x="20" y="196.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">Read source passages and keep your own</text><text x="20" y="218.8" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">notes separately.</text><rect x="20" y="245.2" width="350" height="50" rx="8" fill="#ede8f6" stroke="none"/><text x="34" y="273.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202124">Illustrative card · no clinical content</text><rect x="20" y="315.2" width="350" height="325.8" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="352.2" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Selected medicine and source</text><text x="40" y="388.8" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Cabinet item</text><rect x="40" y="399.0" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="427.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Demo medicine A · 10 mg tablet</text><text x="40" y="472.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Label selection</text><rect x="40" y="482.2" width="310" height="66" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="510.2" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">No real label selected in</text><text x="54" y="532.6" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">prototype</text><text x="40" y="574.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">A source URL, label identifier and</text><text x="40" y="593.8000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">retrieval time appear only after a</text><text x="40" y="613.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">matching label is selected.</text><rect x="20" y="659.0" width="350" height="343.80000000000007" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="696.0" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Label passages</text><text x="40" y="732.6" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Warnings</text><rect x="40" y="742.8000000000001" width="310" height="66" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="770.8000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Matching source passage will</text><text x="54" y="793.2" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">appear here.</text><text x="40" y="833.8000000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Storage</text><rect x="40" y="844.0000000000001" width="310" height="66" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="872.0000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Matching source passage will</text><text x="54" y="894.4000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">appear here.</text><text x="40" y="936.0000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">These are placeholders, not medicine</text><text x="40" y="955.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">guidance. Personal notes are never</text><text x="40" y="975.2000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">presented as label evidence.</text><rect x="20" y="1020.8000000000001" width="350" height="223.0000000000001" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="1057.8000000000002" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Personal note</text><text x="40" y="1094.4" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Note</text><rect x="40" y="1104.6000000000001" width="310" height="66" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="1132.6000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Ask the pharmacist about the</text><text x="54" y="1155.0000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">label match.</text><text x="40" y="1196.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Visible only to people with permission for</text><text x="40" y="1216.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">this patient.</text><rect x="20" y="1261.8000000000002" width="350" height="278.5999999999999" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="1298.8000000000002" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Source evidence</text><text x="40" y="1336.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Provider: openFDA label adapter</text><text x="40" y="1356.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1375.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Status: illustrative layout</text><text x="40" y="1395.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1414.8000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">No claim of a successful live retrieval</text><text x="40" y="1434.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1454.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Open original source when available</text><text x="40" y="1473.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1493.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">No matching label → show information</text><text x="40" y="1512.8000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">unavailable.</text><rect x="20" y="1558.4" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1584.4" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Save personal note</text><rect x="20" y="1618.4" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1644.4" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Back to cabinet</text><rect x="20" y="1678.4" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1704.4" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">View failure state</text><text x="20" y="1759.4" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Design prototype · B2 / Faraaz Jamil Chowdhury</text></svg>