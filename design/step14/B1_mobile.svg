<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1455" viewBox="0 0 390 1455"><rect width="100%" height="100%" fill="#f7f7fa"/><rect x="0" y="0" width="390" height="106" rx="0" fill="#65558f" stroke="none"/><text x="20" y="44.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">MediMate</text><text x="20" y="75.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="white">Synthetic patient 01  /  B1</text><text x="20" y="156.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#202124">Medicine cabinet</text><text x="20" y="196.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">Search for a medicine and choose the</text><text x="20" y="218.8" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">matching identity.</text><rect x="20" y="245.2" width="350" height="50" rx="8" fill="#ede8f6" stroke="none"/><text x="34" y="273.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202124">Personal cabinet · synthetic patient</text><rect x="20" y="315.2" width="350" height="224.59999999999997" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="352.2" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Search medicine terminology</text><text x="40" y="388.8" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Search term</text><rect x="40" y="399.0" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="427.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Demo medicine</text><text x="40" y="473.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Search uses RxNorm. Check name, strength</text><text x="40" y="492.6" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">and form; a result is a candidate, not a</text><text x="40" y="512.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">verified prescription.</text><rect x="20" y="557.8" width="350" height="389.4000000000002" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="594.8" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Selected candidate</text><text x="40" y="631.4" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Display name</text><rect x="40" y="641.6" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="669.6" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Demo medicine A</text><text x="40" y="714.6" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Strength and form</text><rect x="40" y="724.8000000000001" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="752.8000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">10 mg · tablet</text><text x="40" y="797.8000000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Entry source</text><rect x="40" y="808.0000000000001" width="310" height="66" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="836.0000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">External candidate · review</text><text x="54" y="858.4000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">required</text><text x="40" y="900.0000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Prototype search data is illustrative.</text><text x="40" y="919.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Manual entries are labelled user-entered.</text><rect x="20" y="965.2000000000002" width="350" height="239.39999999999998" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="1002.2000000000002" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Your cabinet</text><text x="40" y="1039.8000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Demo medicine A · active</text><text x="40" y="1059.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1079.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Demo medicine B · user-entered</text><text x="40" y="1098.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1118.2000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Filter: active / archived</text><text x="40" y="1137.8000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1157.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Edit details or archive items; referenced</text><text x="40" y="1177.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">history stays available.</text><rect x="20" y="1222.6000000000001" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1248.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Add selected medicine</text><rect x="20" y="1282.6000000000001" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1308.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Enter manually</text><rect x="20" y="1342.6000000000001" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1368.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">View failure state</text><text x="20" y="1423.6000000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#55