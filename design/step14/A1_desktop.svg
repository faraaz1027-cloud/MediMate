 font-weight="400" fill="#555561">Duration</text><rect x="52" y="1004.4000000000003" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="1032.4000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">7 days</text><text x="52" y="1078.4000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Synthetic demonstration only. Match these fields to the original prescription.</text><rect x="756" y="301.20000000000005" width="412" height="239.39999999999998" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="776" y="338.20000000000005" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Version history</text><text x="776" y="375.80000000000007" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Current draft · version 2</text><text x="776" y="395.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="415.00000000000006" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Previous confirmed version 1 retained</text><text x="776" y="434.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="454.20000000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Change preview: duration 5 → 7 days</text><text x="776" y="473.80000000000007" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="493.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Confirming saves a new version; earlier records</text><text x="776" y="513.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">remain.</text><rect x="32" y="1124.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="46" y="1150.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Confirm reviewed version</text><rect x="362" y="1124.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="376" y="1150.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Save draft</text><rect x="692" y="1124.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="706" y="1150.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">View failure state</text><text x="32" y="1217.0000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Design prototype · A1 / Ihfaz Rashid Sadat</text></svg>