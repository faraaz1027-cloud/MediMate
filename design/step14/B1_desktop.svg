<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018"><rect width="100%" height="100%" fill="#f7f7fa"/><rect x="0" y="0" width="1200" height="106" rx="0" fill="#65558f" stroke="none"/><text x="32" y="44.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">MediMate</text><text x="32" y="75.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="white">Synthetic patient 01  /  B1</text><text x="32" y="162.0" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#202124">Medicine cabinet</text><text x="32" y="204.8" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">Search for a medicine and choose the matching identity.</text><rect x="32" y="231.20000000000002" width="1136" height="50" rx="8" fill="#ede8f6" stroke="none"/><text x="46" y="259.20000000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202124">Personal cabinet · synthetic patient</text><rect x="32" y="301.20000000000005" width="700" height="205.0" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="52" y="338.20000000000005" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Search medicine terminology</text><text x="52" y="374.80000000000007" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Search term</text><rect x="52" y="385.00000000000006" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="413.00000000000006" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Demo medicine</text><text x="52" y="459.00000000000006" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Search uses RxNorm. Check name, strength and form; a result is a candidate, not a verified</text><text x="52" y="478.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">prescription.</text><rect x="32" y="524.