serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="415.00000000000006" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Demo medicine B · user-entered</text><text x="776" y="434.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="454.20000000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Filter: active / archived</text><text x="776" y="473.80000000000007" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="493.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Edit details or archive items; referenced history</text><text x="776" y="513.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">stays available.</text><rect x="32" y="894.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="46" y="920.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Add selected medicine</text><rect x="362" y="894.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="376" y="920.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Enter manually</text><rect x="692" y="894.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="706" y="920.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">View failure state</text><text x="32" y="987.0000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Design prototype · B1 / Faraaz Jamil Chowdhury</text></svg>