<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1241" viewBox="0 0 1200 1241"><rect width="100%" height="100%" fill="#f7f7fa"/><rect x="0" y="0" width="1200" height="106" rx="0" fill="#65558f" stroke="none"/><text x="32" y="44.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">MediMate</text><text x="32" y="75.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="white">Synthetic patient 01  /  B2</text><text x="32" y="162.0" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#202124">Medicine information</text><text x="32" y="204.8" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">Read source passages and keep your own notes separately.</text><rect x="32" y="231.20000000000002" width="1136" height="50" rx="8" fill="#ede8f6" stroke="none"/><text x="46" y="259.20000000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202124">Illustrative card · no clinical content</text><rect x="32" y="301.20000000000005" width="700" height="288.20000000000005" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="52" y="338.20000000000005" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Selected medicine and source</text><text x="52" y="374.80000000000007" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Cabinet item</text><rect x="52" y="385.00000000000006" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="413.00000000000006" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Demo medicine A · 10 mg tablet</text><text x="52" y="458.00000000000006" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Label selection</text><rect x="52" y="468.20000000000005" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="496.20000000000005" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">No real label selected in prototype</text><text x="52" y="542.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">A source URL, label identifier and retrieval time appear only after a matching label is</text><text x="52" y="561.8000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">selected.</text><rect x="32" y="607.4000000000001" width="700" height="288.20000000000016" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="52" y="644.4000000000001" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Label passages</text><text x="52" y="681.0000000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Warnings</text><rect x="52" y="691.2000000000002" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="719.2000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Matching source passage will appear here.</text><text x="52" y="764.2000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Storage</text><rect x="52" y="774.4000000000002" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="802.4000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Matching source passage will appear here.</text><text x="52" y="848.4000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">These are placeholders, not medicine guidance. Personal notes are never presented as label</text><text x="52" y="868.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">evidence.</text><rect x="32" y="913.6000000000003" width="700" height="185.39999999999998" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="52" y="950.6000000000003" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Personal note</text><text x="52" y="987.2000000000003" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Note</text><rect x="52" y="997.4000000000003" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="1025.4000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Ask the pharmacist about the label match.</text><text x="52" y="1071.4000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Visible only to people with permission for this patient.</text><rect x="756" y="301.20000000000005" width="412" height="259.0" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="776" y="338.20000000000005" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Source evidence</text><text x="776" y="375.80000000000007" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Provider: openFDA label adapter</text><text x="776" y="395.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="415.00000000000006" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Status: illustrative layout</text><text x="776" y="434.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="454.20000000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">No claim of a successful live retrieval</text><text x="776" y="473.80000000000007" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="493.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Open original source when available</text><text x="776" y="513.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="532.6" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">No matching label → show information unavailable.</text><rect x="32" y="1117.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="46" y="1143.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Save personal note</text><rect x="362" y="1117.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="376" y="1143.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Back to cabinet</text><rect x="692" y="1117.0000000000002" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="706" y="1143.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">View failure state</text><text x="32" y="1210.0000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Design prototype · B2 / Faraaz Jamil Chowdhury</text></svg>