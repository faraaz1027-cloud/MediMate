x="52" y="541.2" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Current status</text><rect x="52" y="551.4000000000001" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="579.4000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Pending · not recorded</text><text x="52" y="625.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Choose Taken or Skipped. Snooze moves the reminder and keeps the scheduled dose unchanged.</text><rect x="32" y="671.0000000000001" width="700" height="288.20000000000016" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="52" y="708.0000000000001" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Reminder and recent history</text><text x="52" y="744.6000000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Channel status</text><rect x="52" y="754.8000000000002" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="782.8000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Accepted by Telegram · not proof of reading</text><text x="52" y="827.8000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Previous record</text><rect x="52" y="838.0000000000002" width="660" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="66" y="866.0000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">01 Nov · 08:00 · Taken</text><text x="52" y="912.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">No response becomes overdue–unconfirmed after the waiting period, never automatically</text><text x="52" y="931.6000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">skipped.</text><rect x="756" y="301.20000000000005" width="412" height="278.6" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="776" y="338.20000000000005" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Today at a glance</text><text x="776" y="375.80000000000007" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Taken: 0 · Skipped: 0</text><text x="776" y="395.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="415.00000000000006" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Pending: 1 · Overdue-unconfirmed: 0</text><text x="776" y="434.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="454.20000000000005" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Next dose: tomorrow at 08:00</text><text x="776" y="473.80000000000007" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="493.4000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Repeated clicks return the same record.</text><text x="776" y="513.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="776" y="532.6" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Stock deduction is tracked once; correction keeps</text><text x="776" y="552.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">history.</text><rect x="32" y="977.2000000000003" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="46" y="1003.2000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Record taken</text><rect x="362" y="977.2000000000003" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="376" y="1003.2000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Record skipped</text><rect x="692" y="977.2000000000003" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="706" y="1003.2000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">View failure state</text><rect x="32" y="1049.2000000000003" width="300" height="48" rx="6" fill="#65558f" stroke="none"/><text x="46" y="1075.2000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Snooze reminder 10 min</text><text x="32" y="1130.2000000000003" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Design prototype · C2 / Sahir Jawad Chowdhury</text></svg>