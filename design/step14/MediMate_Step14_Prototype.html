]], "note": "Prototype search data is illustrative. Manual entries are labelled user-entered."}], "sideTitle": "Your cabinet", "side": ["Demo medicine A \u00b7 active", "Demo medicine B \u00b7 user-entered", "Filter: active / archived", "Edit details or archive items; referenced history stays available."], "primary": "Add selected medicine", "secondary": "Enter manually", "next": "B2", "success": "Medicine added to cabinet", "successBody": "The selected identity and source reference were saved. You can open its information card, edit details or archive it later.", "error": "Search unavailable", "errorBody": "The terminology service did not respond. Retry the search or enter a clearly labelled manual medicine. No candidate was silently selected.", "invalidField": ["Search term", "", "Enter at least one non-space character."], "empty": "No matching candidate. Try another term or enter medicine details manually.", "loading": "Searching medicine identities\u2026", "failure": "Search timed out. Retry or use manual entry."}, {"id": "B2", "title": "Medicine information", "owner": "Faraaz Jamil Chowdhury", "subtitle": "Read source passages and keep your own notes separately.", "status": "Illustrative card \u00b7 no clinical content", "sections": [{"title": "Selected medicine and source", "fields": [["Cabinet item", "Demo medicine A \u00b7 10 mg tablet"], ["Label selection", "No real label selected in prototype"]], "note": "A source URL, label identifier and retrieval time appear only after a matching label is selected."}, {"title": "Label passages", "fields": [["Warnings", "Matching source passage will appear here."], ["Storage", "Matching source passage will appear here."]], "note": "These are placeholders, not medicine guidance. Personal notes are never presented as label evidence."}, {"title": "Personal note", "fields": [["Note", "Ask the pharmacist about the label match."]], "note": "Visible only to people with permission for this patient."}], "sideTitle": "Source evidence", "side": ["Provider: openFDA label adapter", "Status: illustrative layout", "No claim of a successful live retrieval", "Open original source when available", "No matching label \u2192 show information unavailable."], "primary": "Save personal note", "secondary": "Back to cabinet", "next": "C1", "success": "Personal note saved", "successBody": "Your note was saved separately from source passages. Saving a note does not validate a label match or change medicine instructions.", "error": "Information unavailable", "errorBody": "No suitable source label was found. No warnings or storage instructions are inferred. You can retry or return to the cabinet.", "invalidField": null, "empty": "No matching source label. Information unavailable.", "loading": "Retrieving matching label passages\u2026", "failure": "Label service unavailable. Keep the note and retry source retrieval."}, {"id": "C1", "title": "Caregiver tasks", "owner": "Sahir Jawad Chowdhury", "subtitle": "Assign care tasks and keep a clear handover history.", "status": "Patient scope \u00b7 active caregiver access", "sections": [{"title": "Create a task", "fields": [["Title", "Collect the refill checklist"], ["Assignee", "Test caregiver \u00b7 active grant"], ["Due", "2026-11-02 \u00b7 17:00"], ["Handover note", "Check the saved list before collection."]], "note": "Only authorized caregivers can receive and update patient tasks."}, {"title": "Telegram notifications", "fields": [["Linked account", "Test caregiver \u00b7 linked with consent"], ["Notification", "No attempt yet"]], "note": "Channel acceptance and human acknowledgement are tracked separately."}], "sideTitle": "Task board", "side": ["Open \u00b7 Collect refill checklist", "Accepted \u00b7 Review tomorrow's tasks", "Completed \u00b7 Update handover note", "Timeline records assignment, acceptance, completion and reopening.", "Revoked caregivers lose access."], "primary": "Create assigned task", "secondary": "View handover", "next": "C2", "success": "Task assigned", "successBody": "The open task and its handover note were saved. A notification job is queued; delivery and acknowledgement remain separate.", "error": "Caregiver access revoked", "errorBody": "This assignee no longer has access. Select an active authorized caregiver. The task was not assigned and no notification was sent.", "invalidField": ["Assignee", "Test caregiver \u00b7 revoked", "Choose a caregiver with active task permission."], "empty": "No tasks yet. Create one for an authorized caregiver.", "loading": "Loading task board\u2026", "failure": "Task board could not load. Retry; do not assume a task was saved."}, {"id": "C2", "title": "Today\u2019s doses", "owner": "Sahir Jawad Chowdhury", "subtitle": "Record what happened for each scheduled occurrence.", "status": "Mon 02 Nov 2026 \u00b7 Asia/Dhaka", "sections": [{"title": "Due at 08:00", "fields": [["Medicine", "Demo medicine A \u00b7 10 mg"], ["Scheduled quantity", "1 tablet"], ["Current status", "Pending \u00b7 not recorded"]], "note": "Choose Taken or Skipped. Snooze moves the reminder and keeps the scheduled dose unchanged."}, {"title": "Reminder and recent history", "fields": [["Channel status", "Accepted by Telegram \u00b7 not proof of reading"], ["Previous record", "01 Nov \u00b7 08:00 \u00b7 Taken"]], "note": "No response becomes overdue\u2013unconfirmed after the waiting period, never automatically skipped."}], "sideTitle": "Today at a glance", "side": ["Taken: 0 \u00b7 Skipped: 0", "Pending: 1 \u00b7 Overdue-unconfirmed: 0", "Next dose: tomorrow at 08:00", "Repeated clicks return the same record.", "Stock deduction is tracked once; correction keeps history."], "primary": "Record taken", "secondary": "Record skipped", "next": "A1", "success": "Dose recorded as taken", "successBody": "The 08:00 occurrence is now Taken. A repeated request does not create another action or stock deduction. Corrections require a reason.", "error": "Could not confirm save", "errorBody": "The connection failed before confirmation. Check the latest dose status and retry using the same request. Do not display Taken until the server confirms.", "invalidField": null, "empty": "No doses scheduled today. Open the confirmed schedule to review future doses.", "loading": "Loading scheduled doses\u2026", "failure": "Dose records unavailable. Retry; reminder delivery is not proof a dose was taken."}];let current='A1',dose='Pending',snoozed=false,task='Open',incident=false;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(l,v){let typ=l.includes('date')?'date':'text';return `<label class="field">${esc(l)}<input name="${esc(l)}" type="${typ}" value="${esc(v)}" ${['File','Entry source','Label selection','Current status','Channel status','Previous record','Linked account','Notification','Medicine','Cabinet item'].includes(l)?'readonly':''} required></label>`}
function render(){let s=data.find(s=>s.id===current);$('#nav').innerHTML=data.map(x=>`<button data-nav="${x.id}" ${x.id===current?'aria-current="page"':''}>${x.id} ${esc(x.title)}</button>`).join('');$('#main').innerHTML=`<h1>${esc(s.title)}</h1><p class="intro">${esc(s.subtitle)}</p><div class="badge">${esc(s.status)}</div><div id="content"></div><p class="foot">${s.id} · ${esc(s.owner)}<br>Design examples only. Clinical values and external matches are illustrative.</p>`;document.querySelectorAll('[data-nav]').forEach(n=>n.onclick=()=>go(n.dataset.nav));let state=$('#state').value,c=$('#content');if(state==='loading'||state==='empty'){c.innerHTML=`<div class="message" role="status"><h2>${state==='loading'?'Please wait':'Nothing to show yet'}</h2><p>${esc(s[state])}</p><button onclick="resetState()">${state==='loading'?'Finish loading demo':'Back to ready'}</button></div>`;return}if(state==='error'){c.innerHTML=`<div class="message error" role="alert"><h2>${esc(s.error)}</h2><p>${esc(s.errorBody)}</p>${s.invalidField?field(s.invalidField[0],s.invalidField[1])+`<p>${esc(s.invalidField[2])}</p>`:''}<button onclick="resetState()">Back and retry</button></div>`;return}

$('#form').onsubmit=e=>{e.preventDefault();if(current==='A2'){let a=$('[name="Start date"]').value,b=$('[name="End date"]').value;if(b<a){$('#state').value='error';render();return}}if(current==='A1'&&!/^([1-9]\d*|0?\.\d*[1-9]\d*)\s+\S/.test($('[name="Quantity per dose"]').value.trim())){$('#state').value='error';render();return}if(current==='C2'){if(dose!=='Pending'){modal('Already recorded',`This dose is already ${dose}. A repeated click does not create another dose action.`,[['Close',()=>close()]]);return}dose='Taken'}modal(s.success,s.successBody,[['Continue',()=>{close();go(s.next)}],['Stay on this page',()=>{close();render()}]])};$('#failure').onclick=()=>{$('#state').value='error';render()};$('#secondary').onclick=()=>secondary(s);if($('#snooze'))$('#snooze').onclick=()=>{snoozed=true;$('#feedback').textContent='Reminder snoozed for 10 minutes. The scheduled occurrence is unchanged.'};if($('#taskNext'))$('#taskNext').onclick=()=>{task=task==='Open'?'Accepted':task==='Accepted'?'Completed':'Open';render()};}
function go(id){current=id;$('#state').value='ready';render();scrollTo(0,0)}function resetState(){$('#state').value='ready';render()}function close(){$('#dialog').close()}function modal(title,body,actions){const d=$('#dialog');d.innerHTML=`<h2 id="dialogTitle">${esc(title)}</h2><p>${esc(body)}</p><div class="actions"></div>`;for(const [label,fn]of actions){let b=document.createElement('button');b.textContent=label;b.onclick=fn;d.querySelector('.actions').append(b)}if(!d.open)d.showModal()}
function secondary(s){if(s.id==='A1')modal('Draft saved','Your edits remain an unconfirmed draft. This prototype uses temporary in-memory data.',[['Close',close]]);else if(s.id==='A2')go('A1');else if(s.id==='B1'){modal('Manual medicine entry','This entry is user-entered and has no verified external match.',[['Save labelled manual entry',()=>{close();modal('Manual entry saved','User-entered status remains visible.',[['Close',close]])}],['Cancel',close]]);const i=document.createElement('input');i.placeholder='Medicine name';i.setAttribute('aria-label','Medicine name');i.required=true;$('#dialog').insertBefore(i,$('#dialog .actions'));$('#dialog .actions button').onclick=()=>{if(!i.value.trim()){i.reportValidity();return}close();modal('Manual entry saved','User-entered status remains visible.',[['Close',close]])}}else if(s.id==='B2')go('B1');else if(s.id==='C1')modal('Handover history','Created → assigned → accepted → completed. Reopening is recorded as a new event.',[['Close',close]]);else if(s.id==='C2'){if(dose!=='Pending')modal('Already recorded','Use the correction workflow with a reason to change a terminal status.',[['Close',close]]);else modal('Record skipped','Confirm that you want to mark this occurrence skipped.',[['Confirm skipped',()=>{dose='Skipped';close();render()}],['Cancel',close]])}}
function sos(){modal('Emergency SOS test','Location is unavailable. You can still notify two consenting linked test contacts. This demo sends nothing to real people or emergency services.',[['Confirm test SOS',()=>{incident=true;activeSOS()}],['Cancel',close]])}function activeSOS(){modal('Active test incident','Location unavailable. Contact A: accepted by channel. Contact B: acknowledged, I am helping. Provider: SIMULATED, awaiting confirmation. Dispatch unconfirmed.',[['Resolve test incident',finishSOS],['Cancel accidental alert',finishSOS],['Close and return',close]])}function finishSOS(){incident=false;modal('Test incident closed','History retained. Unsent jobs stopped. Closure notices would go only to still-consenting recipients already alerted.',[['Close',close]])}
$('#sos').onclick=()=>incident?activeSOS():sos();$('#state').onchange=render;let hash=location.hash.slice(1);if(data.some(s=>s.id===hash))current=hash;render();
