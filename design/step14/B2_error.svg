nt-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Back and retry</text><text x="20" y="575.2" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Design prototype · B2 / Faraaz Jamil Chowdhury</text></svg>