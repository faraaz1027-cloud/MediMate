<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1667" viewBox="0 0 390 1667"><rect width="100%" height="100%" fill="#f7f7fa"/><rect x="0" y="0" width="390" height="106" rx="0" fill="#65558f" stroke="none"/><text x="20" y="44.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="white">MediMate</text><text x="20" y="75.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="white">Synthetic patient 01  /  A1</text><text x="20" y="156.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#202124">Prescription review</text><text x="20" y="196.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">Review every field before confirming your</text><text x="20" y="218.8" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#555561">prescription.</text><rect x="20" y="245.2" width="350" height="50" rx="8" fill="#ede8f6" stroke="none"/><text x="34" y="273.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#202124">Draft · review required</text><rect x="20" y="315.2" width="350" height="288.2000000000001" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="352.2" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Import prescription</text><text x="40" y="388.8" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Source</text><rect x="40" y="399.0" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="427.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Printed prescription image</text><text x="40" y="472.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">File</text><rect x="40" y="482.2" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="510.2" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">sample-prescription.png · 820 KB</text><text x="40" y="556.2" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Upload PNG or JPG, or enter instructions</text><text x="40" y="575.8000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">manually. OCR text stays editable.</text><rect x="20" y="621.4000000000001" width="350" height="537.8000000000002" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="658.4000000000001" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Review extracted instructions</text><text x="40" y="695.0000000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Medicine name</text><rect x="40" y="705.2000000000002" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="733.2000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">Demo medicine A</text><text x="40" y="778.2000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Strength</text><rect x="40" y="788.4000000000002" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="816.4000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">10 mg</text><text x="40" y="861.4000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Quantity per dose</text><rect x="40" y="871.6000000000003" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="899.6000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">1 tablet</text><text x="40" y="944.6000000000003" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Timing instructions</text><rect x="40" y="954.8000000000003" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="982.8000000000003" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">At 08:00 every day</text><text x="40" y="1027.8000000000002" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Duration</text><rect x="40" y="1038.0000000000002" width="310" height="48" rx="4" fill="#ffffff" stroke="#77717f"/><text x="54" y="1066.0000000000002" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#202124">7 days</text><text x="40" y="1112.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Synthetic demonstration only. Match these</text><text x="40" y="1131.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">fields to the original prescription.</text><rect x="20" y="1177.2000000000003" width="350" height="239.39999999999986" rx="12" fill="#ffffff" stroke="#dad8e0"/><text x="40" y="1214.2000000000003" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202124">Version history</text><text x="40" y="1251.8000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Current draft · version 2</text><text x="40" y="1271.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1291.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Previous confirmed version 1 retained</text><text x="40" y="1310.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1330.2000000000003" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Change preview: duration 5 → 7 days</text><text x="40" y="1349.8000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561"></text><text x="40" y="1369.4" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">Confirming saves a new version; earlier</text><text x="40" y="1389.0000000000002" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#555561">records remain.</text><rect x="20" y="1434.6000000000001" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1460.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Confirm reviewed version</text><rect x="20" y="1494.6000000000001" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1520.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">Save draft</text><rect x="20" y="1554.6000000000001" width="350" height="48" rx="6" fill="#65558f" stroke="none"/><text x="34" y="1580.6000000000001" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">View failure state</text><text x="20" y="1635.6000000000001" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#555561">Design prototype · A1 / Ihfaz Rashid Sadat</text></svg>